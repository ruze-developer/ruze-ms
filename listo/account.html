<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>аккаунт — listo</title><script src="theme.js"></script><link rel="stylesheet" href="style.css"></head><body><header class="site-head"><a class="brand" href="index.html">listo.</a><nav class="head-links"><a href="index.html">главная</a><a href="settings.html">⚙ настройки</a></nav></header><main class="settings-main"><p class="eyebrow">LISTO / АККАУНТ</p><h1>твой аккаунт.</h1><section class="account-panel"><p id="account-state" class="pixel">проверяем авторизацию...</p><form id="auth-form"><label>никнейм<input name="nickname" type="text" autocomplete="username" minlength="3" maxlength="24" pattern="[a-zA-Z0-9_]{3,24}" required placeholder="например, player_67"></label><label>пароль<input name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="минимум 8 символов"></label><div class="account-actions"><button type="submit">войти</button><button type="button" id="signup">зарегистрироваться</button></div></form><div class="oauth-divider">или</div><button type="button" id="google-login" class="google-button">продолжить через Google</button><button type="button" id="logout" hidden>выйти из аккаунта</button><p id="auth-message" class="pixel" role="status"></p><p class="pixel auth-note">при регистрации без email восстановить забытый пароль не получится. сохрани его в менеджере паролей.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="account-page.js"></script><script src="legal-ui.js" defer></script></body></html>
